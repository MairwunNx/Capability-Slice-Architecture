ansform:translate(118px,260px);opacity:0;fill:#1b7c83}84.915%{transform:translate(517px,258px);opacity:0;fill:#bc4c00}85.653%{transform:translate(517px,258px);opacity:1;fill:#bc4c00}90.135%{transform:translate(517px,382px);opacity:1;fill:#bc4c00}97.112%{transform:translate(710px,382px);opacity:1;fill:#bc4c00}97.849%{transform:translate(710px,382px);opacity:0;fill:#bc4c00}}@media (prefers-reduced-motion: reduce){.token{animation:none}}</style>
