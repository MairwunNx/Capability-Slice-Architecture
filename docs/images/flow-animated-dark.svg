ansform:translate(118px,260px);opacity:0;fill:#39c5cf}84.915%{transform:translate(517px,258px);opacity:0;fill:#f0883e}85.653%{transform:translate(517px,258px);opacity:1;fill:#f0883e}90.135%{transform:translate(517px,382px);opacity:1;fill:#f0883e}97.112%{transform:translate(710px,382px);opacity:1;fill:#f0883e}97.849%{transform:translate(710px,382px);opacity:0;fill:#f0883e}}@media (prefers-reduced-motion: reduce){.token{animation:none}}</style>
