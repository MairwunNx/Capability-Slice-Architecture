<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>One screen before and after slicing it into capabilities</title>
<desc>Before: one class owns the whole screen, so the search, the timer, the list, the likes, the form, navigation, and analytics share one piece of code. After: five capabilities, search, timer, results, like, and form, each a whole scenario with its own slice and works. The like capability is the scenario of liking: the tap on any card, the request, and the rollback when the request fails.</desc>
